<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1838">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Hourfall</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>

<div id="hud" class="hidden">
  <div id="bars">
    <div class="row"><span id="lvl">1</span>
      <div class="bars2">
        <div class="bar hp"><i id="hpFill"></i><b id="hpText"></b></div>
        <div class="bar xp"><i id="xpFill"></i></div>
        <div class="bar focus"><i id="focusFill"></i></div>
      </div>
    </div>
    <div id="coins">0</div>
  </div>
  <div id="quest"></div>
  <canvas id="mini" width="220" height="220"></canvas>
  <div id="region"></div>
  <div id="toasts"></div>
  <div id="stick"><div id="knob"></div></div>
  <button id="act" class="hidden"></button>
  <button id="menuBtn" aria-label="Menu">☰</button>
  <button id="flowBtn" class="cbtn hidden">FLOW</button>
  <button id="potBtn" class="cbtn hidden">🧪</button>
  <button id="fleeBtn" class="cbtn hidden">Flee</button>
  <button id="gadBtn" class="cbtn hidden"></button>
  <button id="jumpBtn" class="tbtn hidden" aria-label="Jump">⤒</button>
  <button id="mountBtn" class="tbtn hidden" aria-label="Ride">🐎</button>
</div>

<div id="dialog" class="hidden"><div id="dName"></div><div id="dText"></div><div id="dChoices"></div><div id="dMore">▼</div></div>

<div id="menu" class="hidden">
  <div id="menuBox">
    <div id="tabs"></div>
    <button id="menuClose" aria-label="Close">✕</button>
    <div id="menuBody"></div>
  </div>
</div>

<div id="look" class="hidden"></div>

<div id="crawl" class="hidden"><div id="crawlText"></div><div id="crawlHint">tap to continue</div></div>

<div id="title">
  <div id="titleRing"><i></i></div>
  <h1>HOURFALL</h1>
  <p class="sub">The sun stopped nine days ago.</p>
  <p class="sub2">An open-world RPG of nine countries and one stuck hour</p>
  <button id="btnContinue" class="big hidden">Continue</button>
  <button id="btnNew" class="big">New Game</button>
  <p class="keys">Move: WASD or left thumb · Look: drag · Jump/glide: Space · Ride: H · Fight: tap, click or Space</p>
  <p id="loading">Building the island…</p>
</div>
<div id="fade"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
