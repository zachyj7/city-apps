# Publishes Clock Rate, Hourfall, Big Money and Game Night to GitHub Pages every time main changes.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Each game has its own folder: /clockrate/, /hourfall/, /bigmoney/, /gamenight/. Nothing is served at the site root.
      # Game Night's older addresses send people (and their invite links) on to /gamenight/.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r clockrate/www _site/clockrate
          cp -r hourfall/www _site/hourfall
          cp -r bigmoney/www _site/bigmoney
          cp -r gamenight/www _site/gamenight
          for old in familytiles jensengames; do
            mkdir -p _site/$old
            printf %s "<!doctype html><meta charset=utf-8><title>Game Night</title><script>location.replace('../gamenight/'+location.search)</script><a href=../gamenight/>This is now Game Night</a>" > _site/$old/index.html
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
