# Publishes Clock Rate (www/) and Hourfall (hourfall/www/) to GitHub Pages every time main changes.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Clock Rate is served at the site root, Hourfall under /hourfall/.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r www/. _site/
          cp -r hourfall/www _site/hourfall
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
