<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pivot by City Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2EF; --surface:#FFFFFF; --ink:#12262A; --muted:#5A7074;
  --track:#D7E2DD; --line:#CBD8D3; --scrim:rgba(18,38,42,.38);
  --arc:#0FA08C; --dot:#EE3F74;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F2A2E; --surface:#17393E; --ink:#EAF4F0; --muted:#93AEAC;
    --track:#1F474C; --line:#2A575C; --scrim:rgba(4,14,16,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F2A2E; --surface:#17393E; --ink:#EAF4F0; --muted:#93AEAC;
  --track:#1F474C; --line:#2A575C; --scrim:rgba(4,14,16,.6);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--arc);outline-offset:3px}

.app{flex:1;min-height:0;width:100%;max-width:520px;margin:0 auto;box-sizing:border-box;
  padding:16px 22px 20px;display:flex;flex-direction:column}

.top{display:flex;align-items:flex-start;justify-content:space-between}
.mark{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.studio{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.clock{text-align:right}
.timer{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.delta{font-size:14px;font-weight:700;min-height:18px;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--muted)}
.delta.ahead{color:var(--arc)}
.delta.behind{color:var(--dot)}

.segs{display:flex;gap:4px;margin-top:14px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--track)}
.segs i.on{background:var(--arc)}
.segs i.cur{background:var(--ink)}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;border-radius:28px;cursor:pointer;margin-top:4px}
.lvl{font-size:17px;font-weight:600;color:var(--muted);padding-top:12px}
.ringwrap{flex:1;min-height:0;width:100%;position:relative;display:grid;place-items:center}
canvas{display:block}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.num{font-size:calc(var(--s,300px)*.36);line-height:.9;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.center.finished .num{font-size:calc(var(--s,300px)*.17);line-height:1.1;letter-spacing:-.03em}
.num.pop{animation:pop .22s ease-out}
@keyframes pop{35%{transform:scale(1.12)}}
.sub{font-size:16px;font-weight:500;color:var(--muted);margin-top:8px;max-width:calc(var(--s,300px)*.62);line-height:1.3}
.flash{position:absolute;left:0;right:0;top:calc(50% + var(--s,300px)*.25);font-size:15px;font-weight:700;color:var(--arc);opacity:0}
.flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.hint{min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;font-weight:600;line-height:1.3;padding:0 4px;transition:opacity .2s}
.app[data-state="playing"] .hint,.app[data-state="clearing"] .hint{opacity:0}

.foot{display:flex;gap:12px;padding-top:10px;transition:opacity .2s}
.app[data-state="playing"] .foot,.app[data-state="clearing"] .foot{opacity:0;pointer-events:none}
.btn{flex:1;height:54px;border-radius:18px;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:17px}
.btn.quiet{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.narrow{flex:0 0 auto;padding:0 20px}
.btn:active{transform:scale(.98)}
.run-only{display:none}
.app[data-state="failed"] .run-only,.app[data-state="paused"] .run-only{display:block}
.app[data-state="failed"] .idle-only,.app[data-state="paused"] .idle-only{display:none}

.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:86%;box-sizing:border-box;
  background:var(--surface);border-radius:28px 28px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));
  overflow-y:auto;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet{transform:none;visibility:visible}
.sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
.close{width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);font-size:20px;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:18px;padding:14px 16px}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted);font-weight:600}
.sheet h3{font-size:19px;font-weight:800;margin:24px 0 2px}
.note{color:var(--muted);font-size:15px;line-height:1.35;margin:0 0 8px}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:2px solid var(--bg)}
.row:first-of-type{border-top:0}
.row.locked .sw{opacity:.4}
.row-main{flex:1;min-width:0}
.row-name{font-weight:700;font-size:18px}
.row-desc{color:var(--muted);font-size:15px;margin-top:1px;font-variant-numeric:tabular-nums}
.sw{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:7px solid;box-sizing:border-box;position:relative}
.sw::after{content:"";position:absolute;top:-10px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--d);box-shadow:0 0 0 2px var(--surface)}
.use{flex:0 0 auto;min-width:88px;height:44px;padding:0 14px;border-radius:15px;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px}
.use:disabled{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line);cursor:default}
.credit{text-align:center;color:var(--muted);font-size:14px;font-weight:600;margin:22px 0 0}
.reset{display:block;margin:6px auto 0;background:none;border:0;color:var(--muted);font-size:15px;font-weight:600;text-decoration:underline;padding:10px}

@media (max-height:560px){.lvl{padding-top:4px}.hint{min-height:40px}.btn{height:46px}.segs{margin-top:8px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app" id="app" data-state="ready">
  <header class="top">
    <div>
      <div class="mark">Pivot</div>
      <div class="studio">by City Apps</div>
    </div>
    <div class="clock">
      <div class="timer" id="timer" role="timer" aria-label="Run time">0:00.00</div>
      <div class="delta" id="delta"></div>
    </div>
  </header>
  <div class="segs" id="segs" aria-hidden="true"></div>

  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Play area. Tap, or press space, when the dot is inside the zone.">
    <div class="lvl" id="lvl">Level 1 of 15</div>
    <div class="ringwrap" id="wrap">
      <canvas id="cv" aria-hidden="true"></canvas>
      <div class="center" id="center">
        <div class="num" id="num">4</div>
        <div class="sub" id="sub">hits to go</div>
        <div class="flash" id="flash"></div>
      </div>
    </div>
    <div class="hint" id="hint" aria-live="polite"></div>
  </div>

  <footer class="foot">
    <button class="btn idle-only" id="openRec">Records</button>
    <button class="btn quiet narrow idle-only" id="sound">Sound on</button>
    <button class="btn quiet run-only" id="restart">Restart run</button>
  </footer>
</main>

<div id="rec">
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="recTitle">
    <div class="sheet-top">
      <h2 id="recTitle">Records</h2>
      <button class="close" id="closeRec" aria-label="Close records">✕</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="stBest">None yet</b><span>best time</span></div>
      <div class="stat"><b id="stRuns">0</b><span>runs finished</span></div>
    </div>
    <h3>Colors</h3>
    <p class="note">Faster times unlock new colors.</p>
    <div id="themes"></div>
    <p class="credit">Pivot is a City Apps game.</p>
    <button class="reset" id="reset">Reset records</button>
  </section>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const LEVELS = 15;

/* need: null = always, 0 = finish any run, n = finish under n seconds */
const THEMES = [
  {id:'lagoon',  name:'Lagoon',  arc:'#0FA08C', dot:'#EE3F74', need:null},
  {id:'sherbet', name:'Sherbet', arc:'#F5802A', dot:'#6A4CF0', need:0},
  {id:'glacier', name:'Glacier', arc:'#2E7BF6', dot:'#F2466A', need:240},
  {id:'orchid',  name:'Orchid',  arc:'#A650E0', dot:'#F2A413', need:180},
  {id:'meadow',  name:'Meadow',  arc:'#6FAE1C', dot:'#1C74E8', need:135},
  {id:'ember',   name:'Ember',   arc:'#E5484D', dot:'#E8B100', need:105}
];
const unlocked = (t, best) => t.need === null || (best != null && (t.need === 0 || best < t.need));

/* ---------- time ---------- */
function fmtT(s) {
  const cs = Math.floor(s * 100 + 1e-6), m = Math.floor(cs / 6000), r = cs - m * 6000;
  const sec = Math.floor(r / 100), c = r % 100;
  return m + ':' + (sec < 10 ? '0' : '') + sec + '.' + (c < 10 ? '0' : '') + c;
}
const fmtGoal = n => Math.floor(n / 60) + ':' + ((n % 60) < 10 ? '0' : '') + (n % 60);
const fmtD = d => (d < 0 ? '−' : '+') + Math.abs(d).toFixed(2);

/* ---------- save ---------- */
const KEY = 'pivot-save-v2';
const fresh = () => ({best:null, bestSplits:[], runs:0, played:false, theme:'lagoon', sound:true});
let S = fresh();
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const p = JSON.parse(raw); if (p && typeof p === 'object') S = Object.assign(fresh(), p); }
} catch (e) {}
S.best = (typeof S.best === 'number' && isFinite(S.best) && S.best > 0) ? S.best : null;
S.bestSplits = Array.isArray(S.bestSplits) ? S.bestSplits.filter(x => typeof x === 'number' && isFinite(x)).slice(0, LEVELS) : [];
if (S.best == null || S.bestSplits.length !== LEVELS) S.bestSplits = S.best == null ? [] : S.bestSplits;
S.runs = Math.max(0, Math.floor(Number(S.runs)) || 0);
S.played = !!S.played; S.sound = S.sound !== false;
{ const t = THEMES.find(x => x.id === S.theme); if (!t || !unlocked(t, S.best)) S.theme = 'lagoon'; }
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ---------- elements ---------- */
const app = $('app'), stage = $('stage'), wrap = $('wrap'), cv = $('cv'), ctx = cv.getContext('2d');
const numEl = $('num'), subEl = $('sub'), hintEl = $('hint'), lvlEl = $('lvl'), flashEl = $('flash');
const centerEl = $('center'), timerEl = $('timer'), deltaEl = $('delta'), segsEl = $('segs');
const rec = $('rec'), sheet = $('sheet');
for (let i = 0; i < LEVELS; i++) segsEl.appendChild(document.createElement('i'));

/* ---------- colors ---------- */
let col = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  const g = n => cs.getPropertyValue(n).trim();
  col = {track:g('--track'), bg:g('--bg'), arc:g('--arc'), dot:g('--dot')};
}
function applyTheme() {
  const t = THEMES.find(x => x.id === S.theme) || THEMES[0];
  document.documentElement.style.setProperty('--arc', t.arc);
  document.documentElement.style.setProperty('--dot', t.dot);
  readColors();
}
if (window.matchMedia) {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const cb = () => requestAnimationFrame(readColors);
  if (mq.addEventListener) mq.addEventListener('change', cb); else if (mq.addListener) mq.addListener(cb);
}
new MutationObserver(() => requestAnimationFrame(readColors)).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

/* ---------- sound ---------- */
let ac = null;
function audio() {
  if (!S.sound) return null;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
  return ac;
}
function tone(freq, dur, type, vol, when) {
  const a = audio(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (when || 0);
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
const SCALE = [0, 2, 4, 7, 9];
const note = n => 330 * Math.pow(2, (SCALE[n % 5] + 12 * Math.floor(n / 5)) / 12);
const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

/* ---------- game state ---------- */
let state = 'ready';            // ready | playing | paused | failed | clearing | finished
let level = 1, elapsed = 0, splits = [];
let angle = -Math.PI / 2, dir = 1, rem = 0, target = 0, half = 0.3, omega = 2.4;
let need = 4, left = 4, perfectStreak = 0;
let lockUntil = 0, clearT = 0, pulse = 0, shake = 0, time = 0;
let finishNote = '', newBest = false;
let size = 300, dpr = 1, seed = 1;
const particles = [];

/* Seeded, so every run has the same zone pattern and can be learned. */
function rnd() {
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function cfg(l) {
  const k = (l - 1) / (LEVELS - 1);
  return {need: 3 + Math.ceil(l * 0.5), omega: 2.4 + 2.0 * k, half: (44 - 18 * k) / 2 * DEG};
}
function spawn(minDeg) {
  const lo = minDeg || 100;
  rem = (lo + rnd() * (270 - lo)) * DEG;
  target = angle + dir * rem;
}
function setupLevel() {
  const c = cfg(level);
  need = c.need; left = need; omega = c.omega; half = c.half;
  seed = level * 7919 + 17;
  angle = -Math.PI / 2; dir = 1; spawn(160);
  perfectStreak = 0; clearT = 0;
}
function resetRun() {
  level = 1; elapsed = 0; splits = []; particles.length = 0;
  deltaEl.textContent = ''; deltaEl.className = 'delta';
  setupLevel(); state = 'ready'; ui();
}

/* ---------- HUD ---------- */
function flash(text, color) {
  flashEl.textContent = text;
  flashEl.style.color = color || '';
  flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go');
}
function setLeft(pop) {
  numEl.textContent = left;
  subEl.textContent = left === 1 ? 'hit to go' : 'hits to go';
  if (pop && !RM) { numEl.classList.remove('pop'); void numEl.offsetWidth; numEl.classList.add('pop'); }
}
function ui() {
  app.dataset.state = state;
  const fin = state === 'finished';
  centerEl.classList.toggle('finished', fin);
  const done = fin ? LEVELS : level - 1 + (state === 'clearing' ? 1 : 0);
  for (let i = 0; i < LEVELS; i++) segsEl.children[i].className = i < done ? 'on' : (i === done && state !== 'ready' ? 'cur' : '');
  if (fin) {
    lvlEl.textContent = 'Run complete';
    numEl.textContent = fmtT(elapsed);
    subEl.textContent = finishNote;
    hintEl.textContent = 'Tap to run again';
  } else {
    lvlEl.textContent = 'Level ' + level + ' of ' + LEVELS;
    setLeft(false);
    hintEl.textContent =
      state === 'failed' ? 'Missed. Tap to retry the level' :
      state === 'paused' ? 'Paused. Tap to resume' :
      state === 'ready'  ? (S.played ? 'Tap to start the clock' : 'Tap when the dot is inside the zone. The bright center counts double.') : '';
  }
  timerEl.textContent = fmtT(elapsed);
}

/* ---------- actions ---------- */
function burst(x, y, n, color, speed) {
  if (RM) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = speed * (0.4 + Math.random() * 0.8);
    particles.push({x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, life:0, max:0.45 + Math.random() * 0.35, r:2 + Math.random() * 3.5, color});
  }
}
function ringGeom() {
  const lw = size * 0.085, R = size / 2 - lw / 2 - 12;
  return {c:size / 2, lw, R};
}
function ringBurst() {
  const g = ringGeom();
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * TAU;
    burst(g.c + Math.cos(a) * g.R, g.c + Math.sin(a) * g.R, 3, i % 2 ? col.arc : col.dot, size * 0.5);
  }
}
function hit(perfect) {
  const g = ringGeom(), done = need - left;
  left = Math.max(0, left - (perfect ? 2 : 1));
  if (!S.played) S.played = true;
  if (perfect) { perfectStreak++; flash(perfectStreak > 1 ? 'Perfect ×' + perfectStreak : 'Perfect'); }
  else perfectStreak = 0;
  pulse = 1;
  burst(g.c + Math.cos(angle) * g.R, g.c + Math.sin(angle) * g.R, perfect ? 16 : 9, perfect ? col.dot : col.arc, size * 0.55);
  tone(note(done % 15), 0.17, 'triangle', 0.11);
  if (perfect) tone(note(done % 15) * 2, 0.22, 'sine', 0.05);
  buzz(perfect ? 14 : 8);
  if (left <= 0) { clearLevel(); return; }
  dir = -dir; spawn();
  setLeft(true);
}
function miss() {
  perfectStreak = 0;
  state = 'failed'; shake = 1; lockUntil = performance.now() + 300;
  tone(150, 0.3, 'sawtooth', 0.06); tone(110, 0.34, 'sine', 0.1); buzz([30, 40, 30]);
  ui();
}
function clearLevel() {
  splits[level - 1] = elapsed;
  const pb = S.bestSplits[level - 1];
  if (S.best != null && typeof pb === 'number') {
    const d = elapsed - pb;
    deltaEl.textContent = fmtD(d) + ' vs best';
    deltaEl.className = 'delta ' + (d <= 0 ? 'ahead' : 'behind');
  }
  ringBurst();
  if (level >= LEVELS) { finish(); return; }
  state = 'clearing'; clearT = 0;
  [0, 2, 4].forEach((n, i) => tone(note(n + 5), 0.2, 'triangle', 0.09, i * 0.07));
  buzz([12, 40, 24]);
  left = 0; ui();
  numEl.textContent = '0';
}
function finish() {
  state = 'finished'; clearT = 0; lockUntil = performance.now() + 900;
  const before = S.best;
  S.runs++;
  newBest = before == null || elapsed < before;
  if (newBest) { S.best = elapsed; S.bestSplits = splits.slice(0, LEVELS); }
  const fresh_ = THEMES.filter(t => !unlocked(t, before) && unlocked(t, S.best)).map(t => t.name);
  finishNote = newBest ? (before == null ? 'First finish' : 'New best, ' + (before - elapsed).toFixed(2) + 's faster') : 'Best ' + fmtT(S.best);
  if (fresh_.length) finishNote += '. ' + (fresh_.length === 1 ? fresh_[0] : fresh_.length + ' colors') + ' unlocked';
  [0, 2, 4, 7, 9].forEach((n, i) => tone(note(n + 5), 0.3, 'triangle', 0.1, i * 0.09));
  buzz([20, 50, 20, 50, 40]);
  persist(); ui();
}
function tap() {
  if (rec.classList.contains('open')) return;
  audio();
  if (performance.now() < lockUntil) return;
  if (state === 'playing') {
    const g = ringGeom(), tol = (g.lw * 0.42 / g.R) * 0.5;
    if (Math.abs(rem) <= half + tol) hit(Math.abs(rem) <= half * 0.34); else miss();
  } else if (state === 'ready' || state === 'paused') {
    state = 'playing'; ui();
  } else if (state === 'failed') {
    setupLevel(); state = 'playing'; ui();
  } else if (state === 'finished') {
    resetRun();
  }
}

/* ---------- loop ---------- */
function resize() {
  const r = wrap.getBoundingClientRect();
  size = Math.max(150, Math.min(r.width, r.height, 440));
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = cv.style.height = size + 'px';
  cv.width = cv.height = Math.round(size * dpr);
  stage.style.setProperty('--s', size + 'px');
}
function draw() {
  const g = ringGeom(), c = g.c, R = g.R, lw = g.lw;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  ctx.save();
  if (!RM) {
    const sc = 1 + 0.03 * pulse;
    ctx.translate(c + Math.sin(time * 70) * 9 * shake, c);
    ctx.scale(sc, sc); ctx.translate(-c, -c);
  }
  ctx.lineCap = 'round';
  ctx.lineWidth = lw; ctx.strokeStyle = col.track;
  ctx.beginPath(); ctx.arc(c, c, R, 0, TAU); ctx.stroke();

  if (state === 'clearing' || state === 'finished') {
    const e = 1 - Math.pow(1 - clearT, 3);
    ctx.strokeStyle = col.arc;
    ctx.beginPath(); ctx.arc(c, c, R, angle, angle + Math.max(0.001, TAU * e)); ctx.stroke();
  } else {
    const cap = (lw / 2) / R, a = Math.max(half - cap, 0.002), pa = half * 0.34;
    ctx.strokeStyle = col.arc;
    ctx.beginPath(); ctx.arc(c, c, R, target - a, target + a); ctx.stroke();
    ctx.lineCap = 'butt'; ctx.lineWidth = lw * 0.4; ctx.strokeStyle = 'rgba(255,255,255,.42)';
    ctx.beginPath(); ctx.arc(c, c, R, target - pa, target + pa); ctx.stroke();
  }

  const idle = (state === 'ready' && !RM) ? 1 + 0.08 * Math.sin(time * 4) : 1;
  const mx = c + Math.cos(angle) * R, my = c + Math.sin(angle) * R, mr = lw * 0.42 * idle;
  ctx.fillStyle = col.bg; ctx.beginPath(); ctx.arc(mx, my, mr + 3.5, 0, TAU); ctx.fill();
  ctx.fillStyle = col.dot; ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
  ctx.restore();

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
let last = 0;
function frame(t) {
  const dt = Math.min(0.05, last ? (t - last) / 1000 : 0); last = t; time += dt;
  if (state === 'playing' || state === 'failed' || state === 'clearing') {
    elapsed += dt;
    timerEl.textContent = fmtT(elapsed);
  }
  if (state === 'playing') {
    const g = ringGeom(), tol = (g.lw * 0.42 / g.R) * 0.5;
    rem -= omega * dt;
    angle = target - dir * rem;
    if (rem < -(half + tol)) miss();
  } else if (state === 'clearing') {
    clearT = Math.min(1, clearT + dt / 0.4);
    if (clearT >= 1) { level++; setupLevel(); state = 'playing'; ui(); }
  } else if (state === 'finished') {
    clearT = Math.min(1, clearT + dt / 0.7);
  }
  pulse *= Math.exp(-dt * 10); shake *= Math.exp(-dt * 9);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94;
    if (p.life >= p.max) particles.splice(i, 1);
  }
  draw();
  requestAnimationFrame(frame);
}

/* ---------- records ---------- */
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function renderRec() {
  $('stBest').textContent = S.best == null ? 'None yet' : fmtT(S.best);
  $('stRuns').textContent = S.runs.toLocaleString('en-US');
  const th = $('themes'); th.textContent = '';
  THEMES.forEach(t => {
    const open = unlocked(t, S.best), active = S.theme === t.id;
    const row = el('div', 'row' + (open ? '' : ' locked'));
    const sw = el('span', 'sw'); sw.style.borderColor = t.arc; sw.style.setProperty('--d', t.dot);
    const main = el('div', 'row-main');
    main.appendChild(el('div', 'row-name', t.name));
    main.appendChild(el('div', 'row-desc', t.need === null ? 'Yours from the start' : t.need === 0 ? 'Finish a run' : 'Finish under ' + fmtGoal(t.need)));
    const b = el('button', 'use', active ? 'In use' : open ? 'Use' : 'Locked');
    b.disabled = active || !open;
    b.setAttribute('aria-label', t.name + (active ? ', in use' : open ? ', use this color' : ', locked'));
    b.addEventListener('click', () => { S.theme = t.id; applyTheme(); persist(); renderRec(); });
    row.appendChild(sw); row.appendChild(main); row.appendChild(b); th.appendChild(row);
  });
}
let resetArmed = 0;
const runActive = () => state === 'playing' || state === 'clearing' || state === 'failed' || state === 'paused';
function openRec() {
  if (runActive()) return;
  renderRec(); rec.classList.add('open'); sheet.scrollTop = 0;
  setTimeout(() => { try { $('closeRec').focus({preventScroll:true}); } catch (e) {} }, 60);
}
function closeRec() {
  rec.classList.remove('open'); clearTimeout(resetArmed); resetArmed = 0; $('reset').textContent = 'Reset records';
  try { $('openRec').focus({preventScroll:true}); } catch (e) {}
}
$('openRec').addEventListener('click', openRec);
$('closeRec').addEventListener('click', closeRec);
$('scrim').addEventListener('click', closeRec);
$('restart').addEventListener('click', resetRun);
$('reset').addEventListener('click', () => {
  const b = $('reset');
  if (!resetArmed) {
    b.textContent = 'Tap again to erase everything';
    resetArmed = setTimeout(() => { resetArmed = 0; b.textContent = 'Reset records'; }, 3500);
    return;
  }
  clearTimeout(resetArmed); resetArmed = 0; b.textContent = 'Reset records';
  const snd = S.sound; S = fresh(); S.sound = snd;
  persist(); applyTheme(); resetRun(); renderRec();
});
function soundLabel() { const b = $('sound'); b.textContent = S.sound ? 'Sound on' : 'Sound off'; b.setAttribute('aria-pressed', S.sound ? 'true' : 'false'); }
$('sound').addEventListener('click', () => { S.sound = !S.sound; soundLabel(); persist(); if (S.sound) tone(note(5), 0.15, 'triangle', 0.1); });

/* ---------- input ---------- */
stage.addEventListener('pointerdown', e => { if (e.button && e.button !== 0) return; e.preventDefault(); tap(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && rec.classList.contains('open')) { closeRec(); return; }
  if (rec.classList.contains('open')) return;
  if ((e.key === 'r' || e.key === 'R') && runActive() && !e.repeat) { resetRun(); return; }
  if (e.key === ' ' || e.code === 'Space' || e.key === 'Enter') {
    const tg = e.target;
    if (tg && tg.tagName === 'BUTTON') return;
    if (e.repeat) { e.preventDefault(); return; }
    e.preventDefault(); tap();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'playing' || state === 'clearing') { if (state === 'clearing') { level++; setupLevel(); } state = 'paused'; ui(); } persist(); }
});
window.addEventListener('pagehide', persist);

/* ---------- start ---------- */
applyTheme(); soundLabel(); resize();
if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap); else window.addEventListener('resize', resize);
resetRun();
requestAnimationFrame(frame);
/*__HOOK__*/
})();
</script>
</body>
